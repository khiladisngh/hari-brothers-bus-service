name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master

env:
  GOOGLE_PLACES_API: ${{ secrets.GOOGLE_PLACES_API }}
  GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HARI_BUS_SERVICE_8D1FA }}'
          channelId: live
          projectId: hari-bus-service-8d1fa
